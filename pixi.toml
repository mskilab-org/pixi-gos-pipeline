[workspace]
channels = ["https://prefix.dev/conda-forge", "https://prefix.dev/bioconda", 'conda-forge']
name = "gos-pipeline"
platforms = ['linux-64']
version = "0.1.0"

[tasks]
# 1. This task clones or updates the scripts into a local folder named 'external-scripts'
setup-scripts = "if [ ! -d 'git/gos_process_helpers' ]; then mkdir -p gos_process_helpers ; cd gos_process_helpers ; git clone --recurse-submodules https://github.com/mskilab-org/gos_process_helpers.git ; else cd gos_process_helpers && git pull ; fi"


[dependencies]
samtools = ">=1.21,<2"
vcftools = ">=0.1.16,<0.2"
bcftools = ">=1.21,<2"
htslib = ">=1.21,<2"
tabix = ">=1.11,<2"
pandas = ">=3.1.1,<4"
numpy = ">=2.5.4,<3"
pysam = ">=0.22.1,<0.23"
cyvcf2 = ">=0.31.1,<0.32"
"r-data.table" = ">=1.15.2,<2"
bioconductor-s4vectors = ">=0.40.2,<0.41"
bioconductor-genomicranges = ">=1.54.1,<2"
r-jsonlite = ">=2.0.0,<3"
bioconductor-variantannotation = ">=1.48.1,<2"
bioconductor-biostrings = ">=2.70.1,<3"
r-magrittr = ">=2.0.3,<3"
r-rcpp = ">=1.1.0,<2"
r-igraph = ">=2.0.3,<3"
r-ggplot2 = ">=3.5.2,<4"
r-plotly = ">=4.11.0,<5"
r-devtools = ">=2.4.5,<3"
r-htmlwidgets = ">=1.6.4,<2"
r-stringr = ">=1.5.2,<2"
r-gplots = ">=3.2.0,<4"
r-hwriter = ">=1.3.2.1,<2"
r-optparse = ">=1.7.5,<2"
bioconductor-complexheatmap = ">=2.18.0,<3"
r-arrow = ">=16.1.0,<17"
requests = ">=2.34.2,<3"
urllib3 = ">=2.5.0,<3"
kiwisolver = ">=1.5.1,<2"
idna = ">=3.20,<4"
charset-normalizer = ">=3.5.2,<4"
certifi = ">=2026.10.23,<2027"
parallel = ">=20260922,<20260923"
openjdk = ">=25.0.1,<26"
nodejs = ">=20.12.2,<20.13"
compilers = ">=2.0.0,<3"
make = ">=4.4.1,<5"
pkg-config = ">=0.29.2,<0.30"
c-compiler = ">=2.0.0,<3"
cxx-compiler = ">=2.0.0,<3"
fortran-compiler = ">=2.0.0,<3"
sysroot_linux-64 = ">=2.28,<3"
r-pak = ">=0.9.0,<0.10"
wget = ">=1.21.4,<2"
r-ggpubr = ">=0.6.1,<0.7"
click = ">=8.5.1,<9"
pyyaml = ">=6.0.3,<7"
r-collapse = ">=2.1.3,<3"
snpeff = ">=5.4.0c,<6"
echtvar = ">=0.2.4,<0.3"
"r-r.utils" = ">=2.13.0,<3"

# Keep VEP's native dependencies independent of the main pipeline environment.
[feature.vep.dependencies]
ensembl-vep = ">=116.3,<117"

[environments]
default = { features = [] }
vep = { features = ["vep"], no-default-feature = true }
