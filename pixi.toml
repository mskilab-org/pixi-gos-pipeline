[workspace]
channels = ["https://prefix.dev/conda-forge", "https://prefix.dev/bioconda", 'conda-forge']
name = "gos-pipeline"
platforms = ['linux-64']
version = "0.1.0"

[tasks]
# 1. This task clones or updates the scripts into a local folder named 'external-scripts'
setup-scripts = "if [ ! -d 'git/gos_process_helpers' ]; then mkdir -p gos_process_helpers ; cd gos_process_helpers ; git clone --recurse-submodules https://github.com/mskilab-org/gos_process_helpers.git ; else cd gos_process_helpers && git pull ; fi"


[dependencies]
samtools = ">=1.21,<2"
vcftools = ">=0.1.16,<0.2"
bcftools = ">=1.21,<2"
htslib = ">=1.21,<2"
tabix = ">=1.11,<2"
pandas = ">=3.1.1,<4"
numpy = ">=2.5.4,<3"
pysam = ">=0.22.1,<0.23"
cyvcf2 = ">=0.31.1,<0.32"
"r-data.table" = ">=1.15.2,<2"
bioconductor-s4vectors = ">=0.40.2,<0.41"
bioconductor-genomicranges = ">=1.54.1,<2"
r-jsonlite = ">=2.0.0,<3"
bioconductor-variantannotation = ">=1.48.1,<2"
bioconductor-biostrings = ">=2.70.1,<3"
r-magrittr = ">=2.0.3,<3"
r-rcpp = ">=1.1.0,<2"
r-igraph = ">=2.0.3,<3"
r-ggplot2 = ">=3.5.2,<4"
r-plotly = ">=4.11.0,<5"
r-devtools = ">=2.4.5,<3"
r-htmlwidgets = ">=1.6.4,<2"
r-stringr = ">=1.5.2,<2"
r-gplots = ">=3.2.0,<4"
r-hwriter = ">=1.3.2.1,<2"
r-optparse = ">=1.7.5,<2"
bioconductor-complexheatmap = ">=2.18.0,<3"
r-arrow = ">=16.1.0,<17"
requests = ">=2.34.2,<3"
urllib3 = ">=2.5.0,<3"
kiwisolver = ">=1.5.1,<2"
idna = ">=3.20,<4"
charset-normalizer = ">=3.5.2,<4"
certifi = ">=2026.10.23,<2027"
parallel = ">=20260922,<20260923"
nodejs = ">=20.12.2,<20.13"
compilers = ">=2.0.0,<3"
make = ">=4.4.1,<5"
pkg-config = ">=0.29.2,<0.30"
c-compiler = ">=2.0.0,<3"
cxx-compiler = ">=2.0.0,<3"
fortran-compiler = ">=2.0.0,<3"
sysroot_linux-64 = ">=2.28,<3"
r-pak = ">=0.9.0,<0.10"
wget = ">=1.21.4,<2"
r-ggpubr = ">=0.6.1,<0.7"
click = ">=8.5.1,<9"
pyyaml = ">=6.0.3,<7"
r-collapse = ">=2.1.3,<3"
echtvar = ">=0.2.4,<0.3"
"r-r.utils" = ">=2.13.0,<3"

# Bootstrap after cloning or recreating environments:
#   pixi run -e default setup-pipeline
#   pixi run -e vep setup-vep
# Each setup rechecks jdk.java.net's latest production release; no early access
# or older Conda Java is used. Repeat setup to adopt future Java releases.
# Downloads are verified by the setup scripts, not represented as Conda packages.
# VEP/SnpEff sources are pinned; Java deliberately tracks latest instead of a pin.
# Installed sources live under each environment's opt/ and survive pixi install.
# VEP caches, FASTA, plugins and optional BigWig support are not installed here.
# Runtime commands remain: pixi run -e vep vep ... / pixi run snpEff ...
[feature.runtime.dependencies]
python = ">=3.12,<3.13"

[feature.runtime.activation]
scripts = ["scripts/activate-java.sh"]

[feature.runtime.tasks]
setup-java = { cmd = "python scripts/setup-java.py", description = "Install the latest production upstream JDK with SHA-256 verification" }
setup-java-force = { cmd = "python scripts/setup-java.py --force", description = "Replace the managed JDK even when the latest production version is already installed" }

[tasks.setup-snpeff]
cmd = "python scripts/setup-snpeff.py"
depends-on = ["setup-java"]
description = "Install standalone SnpEff without Conda's older Java dependency"

[tasks.setup-pipeline]
depends-on = ["setup-snpeff"]
description = "Set up the main environment's source-managed tools"

[tasks.setup-snpeff-force]
cmd = "python scripts/setup-snpeff.py --force"
depends-on = ["setup-java-force"]
description = "Replace managed Java and SnpEff, discarding local SnpEff data and configuration"

[tasks.setup-pipeline-force]
depends-on = ["setup-snpeff-force"]
description = "Force reinstall the main environment's source-managed tools"

# Install upstream VEP with setup-vep, not Bioconda's legacy BioPerl metapackage.
[feature.vep.dependencies]
perl = "5.32.*"
perl-bioperl-core = "1.7.8.*"
perl-dbi = "*"
perl-dbd-mysql = ">=4.046,<=4.050"
perl-json = "*"
perl-set-intervaltree = "*"
perl-text-csv = "*"
perl-perlio-gzip = "*"
perl-io-compress = "*"
perl-sereal = "*"
perl-module-build = "0.4234.*"
perl-extutils-cbuilder = "*"
perl-list-moreutils = "*"
perl-io-string = "*"
perl-try-tiny = "*"
perl-uri = "*"
perl-dbd-sqlite = "*"
perl-libwww-perl = "*"
htslib = ">=1.21,<1.25"
samtools = ">=1.21,<2"
zlib = ">=1.3.1,<2"
# Perl 5.32's headers require the glibc 2.17 build sysroot (xlocale.h).
c-compiler = "1.9.*"
sysroot_linux-64 = "2.17.*"
make = ">=4.4.1,<5"

[feature.vep.tasks]
setup-vep = { cmd = "python scripts/setup-vep.py", depends-on = ["setup-java"], description = "Install pinned VEP 116.3 and Bio::DB::HTS without legacy SAMtools dependencies" }
setup-vep-force = { cmd = "python scripts/setup-vep.py --force", depends-on = ["setup-java-force"], description = "Replace managed Java and rebuild pinned VEP and HTS bindings" }

[environments]
default = { features = ["runtime"] }
vep = { features = ["runtime", "vep"], no-default-feature = true }
